<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Spacekeeper</title>
  <style>
    :root { color-scheme: light dark; }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 20px; padding: 0 32px; text-align: center;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
      background: #f5f5f7; color: #1d1d1f;
      -webkit-user-select: none; user-select: none; cursor: default;
    }
    @media (prefers-color-scheme: dark) { body { background: #161617; color: #f5f5f7; } }
    /* 사이드바 로고(.brand-mark, 30px)를 56px로 키운 것 — 앱 아이콘과 같은 모양 */
    .mark {
      position: relative; width: 56px; height: 56px; border-radius: 17px;
      background: linear-gradient(145deg, #74b1ff, #007aff 62%, #2564d9);
      box-shadow: 0 8px 22px rgba(0, 122, 255, 0.32), inset 0 1px 0 rgba(255, 255, 255, 0.38);
    }
    .mark::before, .mark::after, .mark span {
      content: ""; position: absolute; border: 1.5px solid rgba(255, 255, 255, 0.75); border-radius: 50%;
    }
    .mark::before { inset: 13px 7.5px; }
    .mark::after { inset: 7.5px 15px; }
    .mark span { inset: 22.4px 7.5px; height: 9.3px; }
    .name { font-size: 18px; font-weight: 600; letter-spacing: -0.02em; }
    .spinner {
      width: 26px; height: 26px; border-radius: 50%;
      border: 3px solid rgba(128, 128, 128, 0.25); border-top-color: #007aff;
      animation: spin 0.7s linear infinite;
    }
    .hint { font-size: 12.5px; color: #8e8e93; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* 시작 실패: 스피너를 멈추고 무엇이 안 됐는지, 어떻게 하면 되는지만 말한다 */
    .failure { display: none; max-width: 420px; }
    .failure h1 { font-size: 15px; font-weight: 600; margin: 0 0 8px; letter-spacing: -0.01em; }
    .failure p { font-size: 12.5px; line-height: 1.6; color: #6e6e73; margin: 0 0 6px; }
    @media (prefers-color-scheme: dark) { .failure p { color: #a1a1a6; } }
    body.failed .spinner, body.failed .hint { display: none; }
    body.failed .failure { display: block; }
  </style>
</head>
<body>
  <div class="mark"><span></span></div>
  <div class="name">Spacekeeper</div>
  <div class="spinner"></div>
  <div class="hint" id="hint">저장 공간 도우미를 시작하는 중…</div>
  <div class="failure" role="alert">
    <h1>Spacekeeper를 시작하지 못했습니다</h1>
    <p>화면을 띄우는 내부 서버가 응답하지 않았습니다. 메뉴바의 Spacekeeper 아이콘에서 <b>종료</b>를 누른 뒤 다시 열어 주세요.</p>
    <p>계속 안 되면 github.com/tatao4503/spacekeeper 에 알려 주세요.</p>
  </div>
  <script src="loading.js"></script>
</body>
</html>
