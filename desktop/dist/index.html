<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Spacekeeper</title>
  <style>
    :root { color-scheme: light dark; }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 20px;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
      background: #f5f5f7; color: #1d1d1f;
    }
    @media (prefers-color-scheme: dark) { body { background: #161617; color: #f5f5f7; } }
    .mark {
      width: 56px; height: 56px; border-radius: 15px;
      background: linear-gradient(160deg, #4aa3ff, #0071e3);
      box-shadow: 0 6px 20px rgba(0, 113, 227, 0.4);
    }
    .name { font-size: 18px; font-weight: 600; letter-spacing: -0.02em; }
    .spinner {
      width: 26px; height: 26px; border-radius: 50%;
      border: 3px solid rgba(128, 128, 128, 0.25); border-top-color: #0071e3;
      animation: spin 0.7s linear infinite;
    }
    .hint { font-size: 12.5px; color: #8e8e93; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="mark"></div>
  <div class="name">Spacekeeper</div>
  <div class="spinner"></div>
  <div class="hint">저장 공간 도우미를 시작하는 중…</div>
</body>
</html>
