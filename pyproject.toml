[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spacekeeper-local"
version = "0.1.0"
description = "A read-only, local-first macOS storage analysis agent"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Spacekeeper" }]
dependencies = []

[project.scripts]
spacekeeper = "spacekeeper.cli:main"

[tool.setuptools.packages.find]
include = ["spacekeeper*"]
